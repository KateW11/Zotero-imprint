<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Reconcile Folder and Library</title>
    <link rel="stylesheet" href="window.css" />
    <script src="reconcile.js"></script>
  </head>
  <body onload="ReconcileWindow.init()">
    <div class="page">
      <div class="bar">
        <span class="label">Folder</span>
        <span id="dir" class="path"></span>
        <label class="choice">
          <input type="checkbox" id="rescanAll" />Re-read every PDF</label>
        <button id="run" onclick="ReconcileWindow.run()">Reconcile</button>
      </div>

      <div class="bar" style="padding-top: 0">
        <span class="label">Compare against</span>
        <label class="choice">
          <input
            type="radio"
            name="scope"
            value="library"
            checked="checked"
            onchange="ReconcileWindow.scopeChanged()"
          />The whole library</label>
        <label class="choice">
          <input
            type="radio"
            name="scope"
            value="collection"
            onchange="ReconcileWindow.scopeChanged()"
          />One collection</label>
      </div>

      <div class="bar collections" id="scopeCollectionBar" hidden="hidden">
        <span class="label">Collection</span>
        <div id="scopeCollections" class="choices"></div>
      </div>

      <div id="error" class="error" hidden="hidden"></div>
      <div id="summary" class="summary"></div>

      <div class="scroll">
        <div id="sections"></div>
      </div>

      <div class="bar end">
        <button id="copy" onclick="ReconcileWindow.copyMarkdown()">Copy as Markdown</button>
        <button id="close" onclick="window.close()">Close</button>
      </div>
    </div>
  </body>
</html>
