<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-folders-title"></html:h2></label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-sourceDir"
      data-l10n-id="pref-source-dir"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-sourceDir"
      preference="sourceDir"
      style="flex: 1"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-sourceDir-browse"
      data-l10n-id="pref-browse"
    />
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-stagingDir"
      data-l10n-id="pref-staging-dir"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-stagingDir"
      preference="stagingDir"
      style="flex: 1"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-stagingDir-browse"
      data-l10n-id="pref-browse"
    />
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-mirrorDir"
      data-l10n-id="pref-mirror-dir"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-mirrorDir"
      preference="mirrorDir"
      style="flex: 1"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-mirrorDir-browse"
      data-l10n-id="pref-browse"
    />
  </hbox>
  <html:p data-l10n-id="pref-mirror-hint" class="pref-hint"></html:p>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-crossref-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-crossrefEmail"
      data-l10n-id="pref-crossref-email"
    ></html:label>
    <html:input
      type="email"
      id="zotero-prefpane-__addonRef__-crossrefEmail"
      preference="crossrefEmail"
      style="flex: 1"
    ></html:input>
  </hbox>
  <html:p data-l10n-id="pref-crossref-hint" class="pref-hint"></html:p>
</groupbox>

<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
